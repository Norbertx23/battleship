# Stack produkcyjny - model pull (obrazy z GHCR, zero budowania na serwerze).
# Docelowa lokalizacja: /opt/stacks/battleship/docker-compose.yml
#
# Wolumen jest EXTERNAL i wskazuje na istniejacy battleship_postgres_data.
# Jesli wolumen nie istnieje, compose zwroci blad zamiast po cichu utworzyc
# pusta baze - to celowe zabezpieczenie danych.

name: battleship

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: bs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Warsaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # Jednorazowy krok: tworzy schemat PRZED startem api.
  # Ten sam obraz co api. Kod wyjscia != 0 zablokuje start api.
  init-db:
    image: ghcr.io/norbertx23/battleship-api:${APP_TAG:-latest}
    container_name: bs_init_db
    command: ["python", "-m", "init_db"]
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # UWAGA: serwis MUSI nazywac sie `backend` - nginx wewnatrz obrazu web
  # proxuje na http://backend:8000/ (frontend/nginx.conf).
  backend:
    image: ghcr.io/norbertx23/battleship-api:${APP_TAG:-latest}
    container_name: bs_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      init-db:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8011:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    image: ghcr.io/norbertx23/battleship-web:${APP_TAG:-latest}
    container_name: bs_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
    external: true
    name: battleship_postgres_data

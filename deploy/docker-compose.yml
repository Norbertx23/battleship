name: battleship

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: bs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Warsaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  init-db:
    image: ghcr.io/norbertx23/battleship-api:${APP_TAG:-latest}
    container_name: bs_init_db
    command: ["python", "-m", "init_db"]
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  backend:
    image: ghcr.io/norbertx23/battleship-api:${APP_TAG:-latest}
    container_name: bs_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    networks: [internal]
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    image: ghcr.io/norbertx23/battleship-web:${APP_TAG:-latest}
    container_name: bs_web
    restart: unless-stopped
    networks: [internal, edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
    external: true
    name: battleship_postgres_data

networks:
  internal:
  edge:
    external: true

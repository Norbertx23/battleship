<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook – Create room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F1}
a{color:#1F3A93}a:hover{color:#142766}
.paper{background-color:#FBF8F1;background-image:linear-gradient(rgba(31,58,147,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,58,147,0.08) 1px,transparent 1px);background-size:28px 28px}
.hand{font-family:'Caveat',cursive}
.sketch{border:2px solid #1F2A44;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.note{background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 10px 24px -14px rgba(60,40,10,0.35)}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(244,217,120,0.75);transform:rotate(-3deg)}
.btn{transition:transform .15s ease}
.btn:hover{transform:rotate(-1deg) translateY(-2px)}
.cin{border:0;border-bottom:2px solid #1F2A44;background:transparent;font-family:'Caveat',cursive;font-size:30px;color:#1F3A93;height:48px;padding:0 4px;outline:none;width:100%}
.cin:focus{border-bottom-color:#D33F2F}
.cin::placeholder{color:#8A8478}
.num{appearance:none;width:44px;height:44px;border:0;background:transparent;font-family:'Caveat',cursive;font-size:28px;font-weight:700;color:#5C5A55;cursor:pointer;border-radius:50%;padding:0}
.num:hover{color:#1F3A93}
.num.on{color:#1F3A93;box-shadow:0 0 0 2.5px #D33F2F;border-radius:52% 46% 55% 44%/48% 55% 45% 52%}
.cellmini{width:18px;height:18px;background:#DCE6FA;box-shadow:inset 0 0 0 2px #1F3A93}
.lng{min-height:34px;min-width:44px;padding:0 12px;border:0;font:inherit;cursor:pointer}
</style>
</helmet>
<div class="paper" style="min-height: 100vh; color: #1F2A44; font-family: 'Nunito', system-ui, sans-serif; position: relative; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: rgba(211,63,47,0.35);"></div>
  <div style="flex: 1 0 auto; width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" class="hand" style="font-size: 40px; font-weight: 700; color: #1F3A93; text-decoration: none; line-height: 1;">Battleship</a>
      <div style="display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center;">
        <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 24px; font-weight: 700; font-size: 15px;">
          <a href="Main.dc.html" style="color: #1F2A44; text-decoration: underline; text-decoration-color: #D33F2F; text-decoration-thickness: 3px; text-underline-offset: 6px;">{{t.navLobby}}</a>
          <a href="History.dc.html" style="color: #5C5A55; text-decoration: none;">{{t.navHistory}}</a>
          <a href="Rules.dc.html" style="color: #5C5A55; text-decoration: none;">{{t.navRules}}</a>
        </nav>
        <div role="group" aria-label="Language" style="display: inline-flex; border: 2px solid #1F2A44; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800;">
          <button type="button" class="lng" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="background: {{enBg}}; color: {{enFg}};">EN</button>
          <button type="button" class="lng" onClick="{{setPl}}" aria-pressed="{{plPressed}}" style="background: {{plBg}}; color: {{plFg}};">PL</button>
        </div>
      </div>
    </header>

    <a href="Main.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; color: #1F2A44; text-decoration: none;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      {{t.back}}
    </a>

    <main style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start;">
      <form class="note" style="position: relative; flex: 999 1 520px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 28px; transform: rotate(-0.4deg); margin: 0; box-sizing: border-box;">
        <span class="tape" aria-hidden="true"></span>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em;">{{t.newRoom}}</h1>
          <p style="margin: 0; font-size: 16px; color: #5C5A55;">{{t.lead}}</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px; max-width: 360px;">
          <label for="cr-nick" style="font-size: 13px; font-weight: 700; color: #5C5A55;">{{t.yourName}}</label>
          <input id="cr-nick" class="cin" type="text" maxlength="30" placeholder="{{t.namePh}}" style="letter-spacing: 0.02em;">
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;">
          <legend class="hand" style="font-size: 30px; font-weight: 700; color: #1F3A93; padding: 0; margin-bottom: 8px;">{{t.fleet}}</legend>
          <sc-for list="{{ships}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px dashed #CFC8B8;">
              <span style="width: 120px; font-weight: 800; font-size: 16px;">{{s.name}}</span>
              <span aria-hidden="true" style="display: flex; gap: 2px; width: 84px;"><sc-for list="{{s.cells}}" as="c" hint-placeholder-count="3"><span class="cellmini"></span></sc-for></span>
              <span role="radiogroup" aria-label="{{s.name}} count" style="display: flex; gap: 4px; flex-grow: 1;">
                <sc-for list="{{s.options}}" as="o" hint-placeholder-count="6">
                  <button type="button" role="radio" class="{{o.cls}}" aria-checked="{{o.checked}}" onClick="{{o.pick}}">{{o.n}}</button>
                </sc-for>
              </span>
            </div>
          </sc-for>
        </fieldset>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: flex-end;">
          <a href="Room-Code.dc.html" class="btn sketch" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: #1F3A93; border-color: #1F3A93; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none;">{{t.create}}</a>
        </div>
      </form>

      <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding-top: 12px;">
        <h2 class="hand" style="margin: 0; font-size: 32px; font-weight: 700; color: #1F3A93; transform: rotate(-1.5deg);">{{t.next}}</h2>
        <ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.5; color: #3A3934;">
          <li>{{t.s1}}</li>
          <li>{{t.s2}}</li>
          <li>{{t.s3}}</li>
        </ol>
        <a href="Rules.dc.html" style="font-weight: 700; font-size: 15px;">{{t.full}}</a>
      </aside>
    </main>
  </div>
  <footer style="border-top: 1px dashed #CFC8B8;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 2px 24px 2px 104px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 0 16px; align-items: center; justify-content: space-between; font-size: 10px; color: #6B675F;">
      <span>{{t.footer}}</span>
      <nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; font-size: 11px; font-weight: 700;">
        <a href="Privacy.dc.html" style="display: inline-flex; align-items: center; min-height: 28px;">{{t.privacy}}</a>
        <a href="Terms.dc.html" style="display: inline-flex; align-items: center; min-height: 28px;">{{t.terms}}</a>
        <a href="https://github.com/Norbertx23/battleship" style="display: inline-flex; align-items: center; gap: 4px; min-height: 28px;"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 1.98 0 1.428-.015 2.58-.015 2.88 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path></svg>GitHub</a>
      </nav>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  langVals(T) {
    var self = this;
    var lang = (this.state && this.state.lang) || 'en';
    var C = {
      en: { navLobby: 'Lobby', navHistory: 'Match history', navRules: 'How to play', privacy: 'Privacy', terms: 'Terms', footer: 'Battleship · open source (MIT) · Icons: Lucide (ISC), Simple Icons (CC0) · Fonts: Caveat, Nunito (OFL)' },
      pl: { navLobby: 'Lobby', navHistory: 'Historia meczów', navRules: 'Jak grać', privacy: 'Prywatność', terms: 'Regulamin', footer: 'Battleship · open source (MIT) · Ikony: Lucide (ISC), Simple Icons (CC0) · Fonty: Caveat, Nunito (OFL)' }
    };
    var en = lang === 'en';
    return {
      lang: lang,
      t: Object.assign({}, C[lang], T[lang]),
      setEn: function () { self.setState({ lang: 'en' }); },
      setPl: function () { self.setState({ lang: 'pl' }); },
      enPressed: en ? 'true' : 'false', plPressed: en ? 'false' : 'true',
      enBg: en ? '#1F2A44' : 'transparent', enFg: en ? '#FFFFFF' : '#1F2A44',
      plBg: en ? 'transparent' : '#1F2A44', plFg: en ? '#1F2A44' : '#FFFFFF'
    };
  }
  renderVals() {
    var L = this.langVals({ en: {"back": "Back to lobby", "newRoom": "New room", "lead": "Sign your name and circle how many ships of each size you both get.", "yourName": "Your name", "namePh": "e.g. Kraken", "fleet": "Fleet", "create": "Create room", "next": "what happens next?", "s1": "You get a room code. Send it to a friend.", "s2": "When they join, you both place your ships on the grid.", "s3": "Take turns shooting. First to sink the whole fleet wins.", "full": "Read the full rules"}, pl: {"back": "Wróć do lobby", "newRoom": "Nowy pokój", "lead": "Podpisz się i zakreśl, ile statków każdego rozmiaru dostajecie.", "yourName": "Twoje imię", "namePh": "np. Kraken", "fleet": "Flota", "create": "Utwórz pokój", "next": "co dalej?", "s1": "Dostajesz kod pokoju. Wyślij go znajomemu.", "s2": "Gdy znajomy dołączy, oboje rozstawiacie statki na planszy.", "s3": "Strzelacie na zmianę. Wygrywa ten, kto pierwszy zatopi całą flotę.", "full": "Przeczytaj pełne zasady"} });
    var t = L.t;
    var self = this;
    var st = this.state || {};
    var counts = st.counts || { 4: 1, 3: 2, 2: 3, 1: 4 };
    var names = L.lang === 'pl' ? { 4: '4-masztowiec', 3: '3-masztowiec', 2: '2-masztowiec', 1: '1-masztowiec' } : { 4: '4-mast ship', 3: '3-mast ship', 2: '2-mast ship', 1: '1-mast ship' };
    var ships = [4, 3, 2, 1].map(function (size) {
      var cells = [];
      for (var k = 0; k < size; k++) cells.push({ k: k });
      var options = [0, 1, 2, 3, 4, 5].map(function (n) {
        var on = counts[size] === n;
        return {
          n: n,
          cls: on ? 'num on' : 'num',
          checked: on ? 'true' : 'false',
          pick: function () {
            var next = Object.assign({}, (self.state && self.state.counts) || counts);
            next[size] = n;
            self.setState({ counts: next });
          }
        };
      });
      return { name: names[size], cells: cells, options: options };
    });
    return Object.assign({ ships: ships }, L);
  }
}
</script>
</body>
</html>

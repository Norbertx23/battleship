<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook – Deploy fleet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F1}
a{color:#1F3A93}a:hover{color:#142766}
.paper{background-color:#FBF8F1;background-image:linear-gradient(rgba(31,58,147,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,58,147,0.08) 1px,transparent 1px);background-size:28px 28px}
.hand{font-family:'Caveat',cursive}
.sketch{border:2px solid #1F2A44;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.note{background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 10px 24px -14px rgba(60,40,10,0.35)}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(244,217,120,0.75);transform:rotate(-3deg)}
.btn{transition:transform .15s ease}
.btn:hover{transform:rotate(-1deg) translateY(-2px)}
.wrap{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:22px auto;gap:4px;width:min(460px,100%)}
.axis{display:grid;font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#5C5A55;text-align:center;align-items:center}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));align-self:start;border:2px solid #1F2A44;background:#FFFFFF}
.cell{appearance:none;margin:0;padding:0;border:0;aspect-ratio:1/1;box-sizing:border-box;min-width:0;border-right:1px solid #C9D3EE;border-bottom:1px solid #C9D3EE;background:transparent;cursor:pointer}
.cell:hover{background:#FFF4C2}
.cell.ship{background:#DCE6FA;box-shadow:inset 0 0 0 2px #1F3A93}
.cell.prev{background:rgba(31,58,147,0.25)}
.cell.bad{background:rgba(211,63,47,0.28)}
.yard{appearance:none;display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:#FFFFFF;border:2px solid transparent;border-radius:255px 14px 225px 14px/14px 225px 14px 255px;font:inherit;color:#1F2A44;cursor:pointer;text-align:left}
.yard:hover{border-color:#C9D3EE}
.yard.on{border-color:#D33F2F;background:#FFFBEA}
.yard.done{opacity:.45;cursor:default}
.mini{width:20px;height:20px;background:#DCE6FA;box-shadow:inset 0 0 0 2px #1F3A93}
kbd{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;padding:2px 7px;border:1.5px solid #1F2A44;border-radius:5px;background:#FFFFFF}
.lng{min-height:34px;min-width:44px;padding:0 12px;border:0;font:inherit;cursor:pointer}
</style>
</helmet>
<div class="paper" style="min-height: 100vh; color: #1F2A44; font-family: 'Nunito', system-ui, sans-serif; position: relative;">
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: rgba(211,63,47,0.35);"></div>
  <div style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 48px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; color: #1F2A44; text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        {{t.leave}}
      </a>
      <h1 class="hand" style="margin: 0; font-size: 44px; font-weight: 700; color: #1F3A93; line-height: 1;">{{t.title}}</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;">
        <span style="font-size: 15px; color: #5C5A55;">Kraken <span class="hand" style="font-size: 24px; color: #D33F2F;">vs</span> Nautilus · {{t.room}} <strong style="letter-spacing: 0.12em; color: #1F2A44;">7F3K9Q</strong></span>
        <div role="group" aria-label="Language" style="display: inline-flex; border: 2px solid #1F2A44; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800;">
          <button type="button" class="lng" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="background: {{enBg}}; color: {{enFg}};">EN</button>
          <button type="button" class="lng" onClick="{{setPl}}" aria-pressed="{{plPressed}}" style="background: {{plBg}}; color: {{plFg}};">PL</button>
        </div>
      </div>
    </header>

    <main style="display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; align-items: flex-start;">
      <section class="note" style="flex: 0 1 520px; padding: 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; box-sizing: border-box; transform: rotate(-0.4deg);">
        <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: baseline;">
          <h2 class="hand" style="margin: 0; font-size: 32px; font-weight: 700;">{{t.myFleet}}</h2>
          <span class="hand" style="font-size: 22px; color: {{hintColor}};">{{hint}}</span>
        </div>
        <div class="wrap">
          <span></span>
          <div class="axis" style="grid-template-columns: repeat(10, minmax(0, 1fr));"><sc-for list="{{cols}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="axis" style="grid-template-rows: repeat(10, minmax(0, 1fr));"><sc-for list="{{rows}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="board" aria-label="Placement board" onMouseLeave="{{clearHover}}">
            <sc-for list="{{cells}}" as="c" hint-placeholder-count="100"><button type="button" class="{{c.cls}}" aria-label="{{c.label}}" onClick="{{c.click}}" onMouseEnter="{{c.hover}}"></button></sc-for>
          </div>
        </div>
      </section>

      <aside style="flex: 1 1 300px; max-width: 360px; display: flex; flex-direction: column; gap: 20px;">
        <section class="note" style="position: relative; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.6deg);">
          <span class="tape" aria-hidden="true"></span>
          <h2 class="hand" style="margin: 0 0 6px; font-size: 30px; font-weight: 700; color: #1F3A93;">{{t.shipyard}}</h2>
          <sc-for list="{{yard}}" as="y" hint-placeholder-count="4">
            <button type="button" class="{{y.cls}}" onClick="{{y.pick}}" aria-pressed="{{y.pressed}}">
              <span aria-hidden="true" style="display: flex; gap: 2px; width: 92px;"><sc-for list="{{y.cells}}" as="c" hint-placeholder-count="3"><span class="mini"></span></sc-for></span>
              <span style="flex-grow: 1; font-weight: 800; font-size: 15px;">{{y.name}}</span>
              <span class="hand" style="font-size: 24px; font-weight: 700; color: {{y.leftColor}};">{{y.left}}</span>
            </button>
          </sc-for>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;">
            <button type="button" onClick="{{rotate}}" class="btn sketch" style="flex: 1 1 120px; min-height: 44px; background: #FFFFFF; color: #1F2A44; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer;"><span style="display: inline-flex; align-items: center; gap: 8px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>{{rotateLabel}}</span></button>
            <button type="button" onClick="{{reset}}" class="btn sketch" style="flex: 1 1 120px; min-height: 44px; background: #FFFFFF; color: #B4321F; border-color: #B4321F; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer;"><span style="display: inline-flex; align-items: center; gap: 8px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>{{t.clear}}</span></button>
          </div>
        </section>

        <ul style="margin: 0; padding: 0 4px; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #4A4843;">
          <li>{{t.tip1}}</li>
          <li><kbd>R</kbd> {{t.tip2}}</li>
          <li>{{t.tip3}}</li>
        </ul>

        <a href="{{readyHref}}" class="btn sketch" style="display: flex; align-items: center; justify-content: center; min-height: 56px; background: {{readyBg}}; border-color: {{readyBg}}; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none;" aria-disabled="{{readyDisabled}}">{{readyLabel}}</a>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  langVals(T) {
    var self = this;
    var lang = (this.state && this.state.lang) || 'en';
    var C = {
      en: { navLobby: 'Lobby', navHistory: 'Match history', navRules: 'How to play', privacy: 'Privacy', terms: 'Terms', footer: 'Battleship · open source (MIT) · Icons: Lucide (ISC), Simple Icons (CC0) · Fonts: Caveat, Nunito (OFL)' },
      pl: { navLobby: 'Lobby', navHistory: 'Historia meczów', navRules: 'Jak grać', privacy: 'Prywatność', terms: 'Regulamin', footer: 'Battleship · open source (MIT) · Ikony: Lucide (ISC), Simple Icons (CC0) · Fonty: Caveat, Nunito (OFL)' }
    };
    var en = lang === 'en';
    return {
      lang: lang,
      t: Object.assign({}, C[lang], T[lang]),
      setEn: function () { self.setState({ lang: 'en' }); },
      setPl: function () { self.setState({ lang: 'pl' }); },
      enPressed: en ? 'true' : 'false', plPressed: en ? 'false' : 'true',
      enBg: en ? '#1F2A44' : 'transparent', enFg: en ? '#FFFFFF' : '#1F2A44',
      plBg: en ? 'transparent' : '#1F2A44', plFg: en ? '#1F2A44' : '#FFFFFF'
    };
  }
  renderVals() {
    var L = this.langVals({ en: {"room": "room", "leave": "Leave game", "title": "Place your ships", "myFleet": "My fleet", "shipyard": "Shipyard", "clear": "Clear board", "tip1": "Pick a ship, then click a square to place it.", "tip2": "or right‑click rotates · click a placed ship to pick it up", "tip3": "Ships can't touch, not even at the corners.", "mast": "-mast", "done": "done", "rotV": "Rotate (vertical)", "rotH": "Rotate (horizontal)", "allPlaced": "all ships placed!", "left": "{n} ships left", "ready": "I'm ready — start battle", "notReady": "Place every ship to continue"}, pl: {"room": "pokój", "leave": "Opuść grę", "title": "Rozstaw statki", "myFleet": "Moja flota", "shipyard": "Stocznia", "clear": "Wyczyść planszę", "tip1": "Wybierz statek, potem kliknij pole, żeby go postawić.", "tip2": "lub prawy przycisk obraca · kliknij postawiony statek, żeby go podnieść", "tip3": "Statki nie mogą się stykać, nawet rogami.", "mast": "-masztowiec", "done": "gotowe", "rotV": "Obróć (pionowo)", "rotH": "Obróć (poziomo)", "allPlaced": "wszystkie statki ustawione!", "left": "zostało statków: {n}", "ready": "Gotowe — zaczynamy bitwę", "notReady": "Rozstaw wszystkie statki, żeby przejść dalej"} });
    var t = L.t;
    var self = this;
    var N = 10;
    var COLS = 'ABCDEFGHIJ';
    var config = { 4: 1, 3: 2, 2: 3, 1: 4 };
    var startShips = [
      { x: 1, y: 1, size: 4, v: false },
      { x: 7, y: 0, size: 3, v: true },
      { x: 0, y: 4, size: 3, v: false },
      { x: 5, y: 4, size: 2, v: true }
    ];
    var st = this.state || {};
    var ships = st.ships || startShips;
    var sel = st.sel === undefined ? 2 : st.sel;
    var vert = !!st.vert;
    var hover = st.hover === undefined ? null : st.hover;

    var cellsOf = function (s) { var out = []; for (var k = 0; k < s.size; k++) out.push((s.y + (s.v ? k : 0)) * N + s.x + (s.v ? 0 : k)); return out; };
    var occ = {};
    ships.forEach(function (s, idx) { cellsOf(s).forEach(function (c) { occ[c] = idx; }); });
    var placedCount = function (size) { return ships.filter(function (s) { return s.size === size; }).length; };
    var valid = function (s) {
      if (s.x < 0 || s.y < 0) return false;
      if (s.v ? s.y + s.size > N : s.x + s.size > N) return false;
      var cs = cellsOf(s);
      for (var a = 0; a < cs.length; a++) {
        var cx = cs[a] % N, cy = Math.floor(cs[a] / N);
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && ny >= 0 && nx < N && ny < N && occ[ny * N + nx] !== undefined) return false;
        }
      }
      return true;
    };

    var canPlace = sel && placedCount(sel) < config[sel];
    var preview = {}, previewOk = false;
    if (canPlace && hover !== null && occ[hover] === undefined) {
      var cand = { x: hover % N, y: Math.floor(hover / N), size: sel, v: vert };
      previewOk = valid(cand);
      for (var k = 0; k < sel; k++) {
        var px = cand.x + (vert ? 0 : k), py = cand.y + (vert ? k : 0);
        if (px < N && py < N) preview[py * N + px] = true;
      }
    }

    var cells = [];
    for (let i = 0; i < N * N; i++) {
      var cls = 'cell';
      if (occ[i] !== undefined) cls += ' ship';
      else if (preview[i]) cls += previewOk ? ' prev' : ' bad';
      cells.push({
        cls: cls,
        label: COLS[i % N] + (Math.floor(i / N) + 1),
        hover: function () { if ((self.state && self.state.hover) !== i) self.setState({ hover: i }); },
        click: function () {
          if (occ[i] !== undefined) {
            var picked = ships[occ[i]];
            self.setState({ ships: ships.filter(function (_, j) { return j !== occ[i]; }), sel: picked.size, vert: picked.v });
            return;
          }
          if (!canPlace) return;
          var s = { x: i % N, y: Math.floor(i / N), size: sel, v: vert };
          if (!valid(s)) return;
          var next = ships.concat([s]);
          var nextSel = sel;
          if (next.filter(function (q) { return q.size === sel; }).length >= config[sel]) {
            nextSel = [4, 3, 2, 1].filter(function (z) { return next.filter(function (q) { return q.size === z; }).length < config[z]; })[0] || null;
          }
          self.setState({ ships: next, sel: nextSel });
        }
      });
    }

    var yard = [4, 3, 2, 1].map(function (size) {
      var left = config[size] - placedCount(size);
      var c = []; for (var k = 0; k < size; k++) c.push({ k: k });
      return {
        name: size + t.mast,
        cells: c,
        left: left === 0 ? t.done : '× ' + left,
        leftColor: left === 0 ? '#5C5A55' : '#1F3A93',
        cls: 'yard' + (sel === size ? ' on' : '') + (left === 0 ? ' done' : ''),
        pressed: sel === size ? 'true' : 'false',
        pick: function () { if (left > 0) self.setState({ sel: size }); }
      };
    });
    var remaining = [4, 3, 2, 1].reduce(function (a, z) { return a + config[z] - placedCount(z); }, 0);
    var cols = COLS.split('');
    var rows = []; for (var r = 1; r <= N; r++) rows.push(r);
    return Object.assign({
      cells: cells, yard: yard, cols: cols, rows: rows,
      clearHover: function () { self.setState({ hover: null }); },
      rotate: function () { self.setState({ vert: !vert }); },
      rotateLabel: vert ? t.rotV : t.rotH,
      reset: function () { self.setState({ ships: [], sel: 4 }); },
      hint: remaining === 0 ? t.allPlaced : t.left.replace('{n}', remaining),
      hintColor: remaining === 0 ? '#1F3A93' : '#5C5A55',
      readyHref: remaining === 0 ? 'Notebook-Battle.dc.html' : '#',
      readyBg: remaining === 0 ? '#1F3A93' : '#9A968C',
      readyDisabled: remaining === 0 ? 'false' : 'true',
      readyLabel: remaining === 0 ? t.ready : t.notReady
    }, L);
  }
}
</script>
</body>
</html>

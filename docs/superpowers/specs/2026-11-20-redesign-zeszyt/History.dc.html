<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook – Match history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F1}
a{color:#1F3A93}a:hover{color:#142766}
.paper{background-color:#FBF8F1;background-image:linear-gradient(rgba(31,58,147,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,58,147,0.08) 1px,transparent 1px);background-size:28px 28px}
.hand{font-family:'Caveat',cursive}
.sketch{border:2px solid #1F2A44;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.note{background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 10px 24px -14px rgba(60,40,10,0.35)}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(244,217,120,0.75);transform:rotate(-3deg)}
.cin{border:0;border-bottom:2px solid #1F2A44;background:transparent;font-family:'Caveat',cursive;font-size:28px;color:#1F3A93;height:46px;padding:0 4px;outline:none;width:100%}
.cin:focus{border-bottom-color:#D33F2F}
.cin::placeholder{color:#8A8478}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{appearance:none;min-width:44px;height:44px;border:0;background:transparent;font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:#5C5A55;cursor:pointer;padding:0 6px}
.pg.on{color:#1F3A93;box-shadow:0 0 0 2.5px #D33F2F;border-radius:52% 46% 55% 44%/48% 55% 45% 52%}
.lng{min-height:34px;min-width:44px;padding:0 12px;border:0;font:inherit;cursor:pointer}
</style>
</helmet>
<div class="paper" style="min-height: 100vh; color: #1F2A44; font-family: 'Nunito', system-ui, sans-serif; position: relative; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: rgba(211,63,47,0.35);"></div>
  <div style="flex: 1 0 auto; width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" class="hand" style="font-size: 40px; font-weight: 700; color: #1F3A93; text-decoration: none; line-height: 1;">Battleship</a>
      <div style="display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center;">
        <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 24px; font-weight: 700; font-size: 15px;">
          <a href="Main.dc.html" style="color: #5C5A55; text-decoration: none;">{{t.navLobby}}</a>
          <a href="History.dc.html" style="color: #1F2A44; text-decoration: underline; text-decoration-color: #D33F2F; text-decoration-thickness: 3px; text-underline-offset: 6px;">{{t.navHistory}}</a>
          <a href="Rules.dc.html" style="color: #5C5A55; text-decoration: none;">{{t.navRules}}</a>
        </nav>
        <div role="group" aria-label="Language" style="display: inline-flex; border: 2px solid #1F2A44; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800;">
          <button type="button" class="lng" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="background: {{enBg}}; color: {{enFg}};">EN</button>
          <button type="button" class="lng" onClick="{{setPl}}" aria-pressed="{{plPressed}}" style="background: {{plBg}}; color: {{plFg}};">PL</button>
        </div>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="hand" style="font-size: 26px; color: #D33F2F; transform: rotate(-2deg); align-self: flex-start;">{{t.kicker}}</span>
        <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.02em;">{{t.navHistory}}</h1>
      </div>
      <div style="width: min(320px, 100%); display: flex; flex-direction: column; gap: 2px;">
        <label for="h-search" style="font-size: 13px; font-weight: 700; color: #5C5A55;">{{t.find}}</label>
        <input id="h-search" class="cin" type="text" placeholder="{{t.findPh}}" value="{{query}}" onInput="{{onSearch}}">
      </div>
    </div>

    <section class="note" style="position: relative; padding: 28px 28px 20px; transform: rotate(-0.3deg);">
      <span class="tape" aria-hidden="true"></span>
      <div style="overflow-x: auto;">
        <div style="min-width: 480px;">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr) 130px; column-gap: 12px; padding: 0 0 10px; border-bottom: 2px solid #1F2A44; font-size: 13px; font-weight: 800; color: #5C5A55; text-transform: uppercase; letter-spacing: 0.06em;">
            <span>{{t.winner}}</span><span></span><span>{{t.defeated}}</span><span style="text-align: right;">{{t.played}}</span>
          </div>
          <sc-for list="{{rows}}" as="m" hint-placeholder-count="8">
            <div style="display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr) 130px; column-gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px dashed #CFC8B8; font-size: 16px;" title="{{m.full}}">
              <strong class="trunc">{{m.winner}}</strong>
              <span class="hand" style="font-size: 22px; color: #5C5A55; line-height: 1;">{{t.sank}}</span>
              <span class="trunc" style="color: #B4321F; text-decoration: line-through;">{{m.loser}}</span>
              <span style="color: #6B675F; font-size: 14px; text-align: right; white-space: nowrap;">{{m.date}}</span>
            </div>
          </sc-for>
          <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
            <p class="hand" style="margin: 0; padding: 24px 0; font-size: 28px; color: #5C5A55; text-align: center;">{{t.empty}}</p>
          </sc-if>
        </div>
      </div>
      <nav aria-label="Pages" style="display: flex; justify-content: center; align-items: center; gap: 6px; padding-top: 16px;">
        <button type="button" class="pg" aria-label="{{t.prev}}">‹</button>
        <button type="button" class="pg on" aria-current="page">1</button>
        <button type="button" class="pg">2</button>
        <button type="button" class="pg">3</button>
        <button type="button" class="pg" aria-label="{{t.nextPage}}">›</button>
      </nav>
      <p style="margin: 18px 0 0; display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; color: #5C5A55;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>{{t.note1}} <a href="https://github.com/Norbertx23/battleship/issues">GitHub Issues</a>.</span></p>
    </section>
  </div>
  <footer style="border-top: 1px dashed #CFC8B8;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 2px 24px 2px 104px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 0 16px; align-items: center; justify-content: space-between; font-size: 10px; color: #6B675F;">
      <span>{{t.footer}}</span>
      <nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; font-size: 11px; font-weight: 700;">
        <a href="Privacy.dc.html" style="display: inline-flex; align-items: center; min-height: 28px;">{{t.privacy}}</a>
        <a href="Terms.dc.html" style="display: inline-flex; align-items: center; min-height: 28px;">{{t.terms}}</a>
        <a href="https://github.com/Norbertx23/battleship" style="display: inline-flex; align-items: center; gap: 4px; min-height: 28px;"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 1.98 0 1.428-.015 2.58-.015 2.88 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path></svg>GitHub</a>
      </nav>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  langVals(T) {
    var self = this;
    var lang = (this.state && this.state.lang) || 'en';
    var C = {
      en: { navLobby: 'Lobby', navHistory: 'Match history', navRules: 'How to play', privacy: 'Privacy', terms: 'Terms', footer: 'Battleship · open source (MIT) · Icons: Lucide (ISC), Simple Icons (CC0) · Fonts: Caveat, Nunito (OFL)' },
      pl: { navLobby: 'Lobby', navHistory: 'Historia meczów', navRules: 'Jak grać', privacy: 'Prywatność', terms: 'Regulamin', footer: 'Battleship · open source (MIT) · Ikony: Lucide (ISC), Simple Icons (CC0) · Fonty: Caveat, Nunito (OFL)' }
    };
    var en = lang === 'en';
    return {
      lang: lang,
      t: Object.assign({}, C[lang], T[lang]),
      setEn: function () { self.setState({ lang: 'en' }); },
      setPl: function () { self.setState({ lang: 'pl' }); },
      enPressed: en ? 'true' : 'false', plPressed: en ? 'false' : 'true',
      enBg: en ? '#1F2A44' : 'transparent', enFg: en ? '#FFFFFF' : '#1F2A44',
      plBg: en ? 'transparent' : '#1F2A44', plFg: en ? '#1F2A44' : '#FFFFFF'
    };
  }
  renderVals() {
    var L = this.langVals({ en: {"kicker": "the logbook", "find": "Find a player", "findPh": "type a name…", "winner": "Winner", "defeated": "Defeated", "played": "Played", "sank": "sank", "empty": "no games with that name yet", "prev": "Previous page", "nextPage": "Next page", "month": "Nov", "note1": "Player names are typed in by players and aren't moderated. If a name breaks the rules or contains your personal data, ask for it to be removed via", "note2": "."}, pl: {"kicker": "dziennik pokładowy", "find": "Znajdź gracza", "findPh": "wpisz nick…", "winner": "Zwycięzca", "defeated": "Pokonany", "played": "Data", "sank": "zatapia", "empty": "brak gier z tym nickiem", "prev": "Poprzednia strona", "nextPage": "Następna strona", "month": "lis", "note1": "Nicki wpisują sami gracze i nie są moderowane. Jeśli jakiś nick łamie zasady albo zawiera Twoje dane, poproś o jego usunięcie przez", "note2": "."} });
    var t = L.t;
    var self = this;
    var st = this.state || {};
    var query = st.query || '';
    var all = [
      ['Kraken', 'Captain_Tidebreaker_1987', '18', '21:40'],
      ['Sonar_X', 'Mira', '18', '20:12'],
      ['TheUnsinkableAdmiralNautilus', 'Kraken', '18', '19:55'],
      ['Mira', 'Harpoon', '17', '23:08'],
      ['Kraken', 'Sonar_X', '17', '22:31'],
      ['Harpoon', 'Captain_Tidebreaker_1987', '17', '18:02'],
      ['Nautilus', 'Mira', '16', '21:15'],
      ['Sonar_X', 'Kraken', '16', '20:40']
    ].map(function (r) { var d = r[2] + ' ' + t.month + ', ' + r[3]; return { winner: r[0], loser: r[1], date: d, full: r[0] + ' ' + t.sank + ' ' + r[1] + ' · ' + d }; });
    var q = query.trim().toLowerCase();
    var rows = q ? all.filter(function (m) { return m.winner.toLowerCase().indexOf(q) >= 0 || m.loser.toLowerCase().indexOf(q) >= 0; }) : all;
    return Object.assign({
      rows: rows,
      empty: rows.length === 0,
      query: query,
      onSearch: function (e) { self.setState({ query: e.target.value }); }
    }, L);
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook – Game over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F1}
a{color:#1F3A93}a:hover{color:#142766}
.paper{background-color:#FBF8F1;background-image:linear-gradient(rgba(31,58,147,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,58,147,0.08) 1px,transparent 1px);background-size:28px 28px}
.hand{font-family:'Caveat',cursive}
.sketch{border:2px solid #1F2A44;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.note{background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 10px 24px -14px rgba(60,40,10,0.35)}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(244,217,120,0.75);transform:rotate(-3deg)}
.btn{transition:transform .15s ease}
.btn:hover{transform:rotate(-1deg) translateY(-2px)}
.wrap{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:22px auto;gap:4px;width:min(340px,100%)}
.axis{display:grid;font-family:'Caveat',cursive;font-size:18px;font-weight:700;color:#5C5A55;text-align:center;align-items:center}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));align-self:start;border:2px solid #1F2A44;background:#FFFFFF}
.cell{aspect-ratio:1/1;box-sizing:border-box;min-width:0;border-right:1px solid #C9D3EE;border-bottom:1px solid #C9D3EE;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-weight:700;font-size:22px;line-height:1}
.cell.ship{background:#DCE6FA;box-shadow:inset 0 0 0 2px #1F3A93}
.cell.ghost{box-shadow:inset 0 0 0 2px #1F3A93;background:repeating-linear-gradient(-45deg,rgba(31,58,147,0.12) 0 2px,transparent 2px 6px)}
.cell.hit::after{content:"\2715";color:#D33F2F}
.cell.sunk{background:repeating-linear-gradient(45deg,rgba(211,63,47,0.22) 0 3px,transparent 3px 7px)}
.cell.sunk::after{content:"\2715";color:#D33F2F}
.cell.miss::after{content:"";width:6px;height:6px;border-radius:50%;background:#5C5A55}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.scribble{stroke-dasharray:600;animation:draw 1.2s ease-out .2s both}
.lng{min-height:34px;min-width:44px;padding:0 12px;border:0;font:inherit;cursor:pointer}
</style>
</helmet>
<div class="paper" style="min-height: 100vh; color: #1F2A44; font-family: 'Nunito', system-ui, sans-serif; position: relative;">
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: rgba(211,63,47,0.35);"></div>
  <div style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 48px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; color: #1F2A44; text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        {{t.back}}
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;">
        <span style="font-size: 15px; color: #5C5A55;">Kraken <span class="hand" style="font-size: 24px; color: #D33F2F;">vs</span> Nautilus · {{t.room}} <strong style="letter-spacing: 0.12em; color: #1F2A44;">7F3K9Q</strong></span>
        <div role="group" aria-label="Language" style="display: inline-flex; border: 2px solid #1F2A44; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800;">
          <button type="button" class="lng" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="background: {{enBg}}; color: {{enFg}};">EN</button>
          <button type="button" class="lng" onClick="{{setPl}}" aria-pressed="{{plPressed}}" style="background: {{plBg}}; color: {{plFg}};">PL</button>
        </div>
      </div>
    </header>

    <section style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: center; text-align: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <h1 class="hand" style="margin: 0; font-size: clamp(64px, 9vw, 112px); font-weight: 700; line-height: 1.1; color: {{titleColor}}; text-decoration: underline wavy #D33F2F; text-decoration-thickness: 3px; text-underline-offset: 16px;">{{title}}</h1>
        <p style="margin: 6px 0 0; font-size: 18px; color: #4A4843; max-width: 460px;">{{subtitle}}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; min-width: 260px;">
        <button type="button" onClick="{{again}}" class="btn sketch" style="min-height: 56px; padding: 0 28px; background: {{againBg}}; border-color: {{againBg}}; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 800; cursor: pointer;">{{againLabel}}</button>
        <span role="status" class="hand" style="font-size: 22px; color: #5C5A55; min-height: 26px;">{{againHint}}</span>
      </div>
    </section>

    <main style="display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start;">
      <section class="note" style="flex: 0 1 400px; padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: center; box-sizing: border-box; transform: rotate(-0.6deg);">
        <h2 class="hand" style="margin: 0; align-self: flex-start; font-size: 30px; font-weight: 700;">{{t.myFleet}}</h2>
        <div class="wrap">
          <span></span>
          <div class="axis" style="grid-template-columns: repeat(10, minmax(0, 1fr));"><sc-for list="{{cols}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="axis" style="grid-template-rows: repeat(10, minmax(0, 1fr));"><sc-for list="{{rows}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="board" aria-label="My final board"><sc-for list="{{mine}}" as="c" hint-placeholder-count="100"><div class="{{c.cls}}"></div></sc-for></div>
        </div>
      </section>

      <section class="note" style="position: relative; flex: 0 1 400px; padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: center; box-sizing: border-box; transform: rotate(0.6deg);">
        <span class="tape" aria-hidden="true"></span>
        <h2 class="hand" style="margin: 0; align-self: flex-start; font-size: 30px; font-weight: 700;">{{t.theirFleet}}</h2>
        <div class="wrap">
          <span></span>
          <div class="axis" style="grid-template-columns: repeat(10, minmax(0, 1fr));"><sc-for list="{{cols}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="axis" style="grid-template-rows: repeat(10, minmax(0, 1fr));"><sc-for list="{{rows}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="board" aria-label="Enemy final board"><sc-for list="{{theirs}}" as="c" hint-placeholder-count="100"><div class="{{c.cls}}"></div></sc-for></div>
        </div>
      </section>

      <aside class="note" style="flex: 1 1 200px; max-width: 260px; padding: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #4A4843; transform: rotate(-1deg);">
        <h2 class="hand" style="margin: 0; font-size: 26px; font-weight: 700; color: #1F2A44;">{{t.key}}</h2>
        <div style="display: flex; align-items: center; gap: 10px;"><span class="cell sunk" style="width: 24px; border: 1px solid #C9D3EE;"></span>{{t.sunk}}</div>
        <div style="display: flex; align-items: center; gap: 10px;"><span class="cell miss" style="width: 24px; border: 1px solid #C9D3EE;"></span>{{t.miss}}</div>
        <div style="display: flex; align-items: center; gap: 10px;"><span class="cell ghost" style="width: 24px;"></span>{{t.never}}</div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["victory","defeat"],"default":"victory"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  langVals(T) {
    var self = this;
    var lang = (this.state && this.state.lang) || 'en';
    var C = {
      en: { navLobby: 'Lobby', navHistory: 'Match history', navRules: 'How to play', privacy: 'Privacy', terms: 'Terms', footer: 'Battleship · open source (MIT) · Icons: Lucide (ISC), Simple Icons (CC0) · Fonts: Caveat, Nunito (OFL)' },
      pl: { navLobby: 'Lobby', navHistory: 'Historia meczów', navRules: 'Jak grać', privacy: 'Prywatność', terms: 'Regulamin', footer: 'Battleship · open source (MIT) · Ikony: Lucide (ISC), Simple Icons (CC0) · Fonty: Caveat, Nunito (OFL)' }
    };
    var en = lang === 'en';
    return {
      lang: lang,
      t: Object.assign({}, C[lang], T[lang]),
      setEn: function () { self.setState({ lang: 'en' }); },
      setPl: function () { self.setState({ lang: 'pl' }); },
      enPressed: en ? 'true' : 'false', plPressed: en ? 'false' : 'true',
      enBg: en ? '#1F2A44' : 'transparent', enFg: en ? '#FFFFFF' : '#1F2A44',
      plBg: en ? 'transparent' : '#1F2A44', plFg: en ? '#1F2A44' : '#FFFFFF'
    };
  }
  renderVals() {
    var L = this.langVals({ en: {"room": "room", "back": "Back to lobby", "myFleet": "My fleet", "theirFleet": "Their fleet, revealed", "key": "Key", "sunk": "Sunk", "miss": "Miss", "never": "Never found", "again": "Play again", "waiting": "Waiting for Nautilus…", "accept": "Accept rematch", "sent": "we sent them your rematch request", "wants": "Nautilus wants a rematch!", "won": "You won!", "lost": "You lost…", "wonSub": "Every one of Nautilus’s ships is at the bottom of the page. Nicely done.", "lostSub": "Nautilus found all of your ships this time. Have a look where theirs were hiding."}, pl: {"room": "pokój", "back": "Wróć do lobby", "myFleet": "Moja flota", "theirFleet": "Flota przeciwnika", "key": "Legenda", "sunk": "Zatopiony", "miss": "Pudło", "never": "Nieodnaleziony", "again": "Zagraj ponownie", "waiting": "Czekamy na Nautilusa…", "accept": "Przyjmij rewanż", "sent": "wysłaliśmy prośbę o rewanż", "wants": "Nautilus chce rewanżu!", "won": "Wygrana!", "lost": "Przegrana…", "wonSub": "Wszystkie statki Nautilusa leżą na dnie kartki. Świetna robota.", "lostSub": "Tym razem Nautilus znalazł wszystkie Twoje statki. Zobacz, gdzie chowały się jego."} });
    var t = L.t;
    var self = this;
    var won = (this.props.result ?? 'victory') === 'victory';
    var N = 10;
    var key = function (p) { return p[1] * N + p[0]; };
    var toSet = function (list) { var o = {}; list.forEach(function (p) { o[key(p)] = true; }); return o; };
    var myShips = toSet([[1,1],[2,1],[3,1],[4,1],[7,0],[7,1],[7,2],[0,4],[1,4],[2,4],[5,4],[5,5],[8,5],[9,5],[2,7],[3,7],[7,8],[0,9],[9,9],[5,8]]);
    var myHitList = won ? [[2,1],[3,1],[7,8],[0,4],[1,4],[2,4],[9,9]] : Object.keys(myShips).map(function (k) { return [k % N, Math.floor(k / N)]; });
    var myHits = toSet(myHitList);
    var myMiss = toSet([[0,0],[5,2],[9,3],[4,6],[6,9],[1,7],[3,5],[6,3],[8,8],[4,0]]);
    var enemy = toSet([[0,0],[0,1],[0,2],[0,3],[3,3],[3,4],[3,5],[9,4],[9,5],[9,6],[8,0],[9,0],[6,7],[6,8],[1,8],[2,8],[5,1],[7,4],[4,9],[8,9]]);
    var found = won ? enemy : toSet([[3,3],[3,4],[3,5],[6,7],[6,8],[8,0],[9,0],[5,1]]);
    var theirMiss = toSet([[1,1],[5,0],[8,2],[0,6],[6,5],[9,8],[2,9],[7,7],[4,4],[2,2],[7,1]]);
    var mine = [], theirs = [];
    for (var i = 0; i < N * N; i++) {
      var a = 'cell';
      if (myShips[i]) a += myHits[i] ? ' sunk' : ' ship';
      else if (myMiss[i]) a += ' miss';
      mine.push({ cls: a });
      var b = 'cell';
      if (enemy[i]) b += found[i] ? ' sunk' : ' ghost';
      else if (theirMiss[i]) b += ' miss';
      theirs.push({ cls: b });
    }
    var st = this.state || {};
    var again = st.again || 'idle';
    var labels = { idle: t.again, waiting: t.waiting, asked: t.accept };
    var hints = { idle: '', waiting: t.sent, asked: t.wants };
    var cols = 'ABCDEFGHIJ'.split('');
    var rows = []; for (var r = 1; r <= N; r++) rows.push(r);
    return Object.assign({
      mine: mine, theirs: theirs, cols: cols, rows: rows,
      title: won ? t.won : t.lost,
      titleColor: won ? '#1F3A93' : '#B4321F',
      subtitle: won ? t.wonSub : t.lostSub,
      againLabel: labels[again],
      againHint: hints[again],
      againBg: again === 'waiting' ? '#9A968C' : (again === 'asked' ? '#D33F2F' : '#1F3A93'),
      again: function () {
        var next = again === 'idle' ? 'waiting' : (again === 'waiting' ? 'asked' : 'idle');
        self.setState({ again: next });
      }
    }, L);
  }
}
</script>
</body>
</html>

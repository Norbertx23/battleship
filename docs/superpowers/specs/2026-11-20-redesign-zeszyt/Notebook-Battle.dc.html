<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook – Battle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F1}
a{color:#1F3A93}a:hover{color:#142766}
.paper{background-color:#FBF8F1;background-image:linear-gradient(rgba(31,58,147,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,58,147,0.08) 1px,transparent 1px);background-size:28px 28px}
.hand{font-family:'Caveat',cursive}
.sketch{border:2px solid #1F2A44;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.note{background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,0.04),0 10px 24px -14px rgba(60,40,10,0.35)}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(244,217,120,0.75);transform:rotate(-3deg)}
.wrap{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:22px auto;gap:4px;width:min(390px,100%)}
.axis{display:grid;font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#5C5A55;text-align:center;align-items:center}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));align-self:start;border:2px solid #1F2A44;background:#FFFFFF}
.cell{appearance:none;margin:0;padding:0;border:0;aspect-ratio:1/1;box-sizing:border-box;min-width:0;border-right:1px solid #C9D3EE;border-bottom:1px solid #C9D3EE;background:transparent;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-weight:700;font-size:26px;line-height:1;color:inherit;position:relative}
button.cell{cursor:crosshair}
button.cell:hover{background:#FFF4C2}
.cell.ship{background:#DCE6FA;box-shadow:inset 0 0 0 2px #1F3A93}
.cell.hit::after{content:"\2715";color:#D33F2F}
.cell.sunk{background:repeating-linear-gradient(45deg,rgba(211,63,47,0.22) 0 3px,transparent 3px 7px)}
.cell.sunk::after{content:"\2715";color:#D33F2F}
.cell.miss::after{content:"";width:6px;height:6px;border-radius:50%;background:#5C5A55}
.cell.mark{background:#FFE873}
.lng{min-height:34px;min-width:44px;padding:0 12px;border:0;font:inherit;cursor:pointer}
</style>
</helmet>
<div class="paper" style="min-height: 100vh; color: #1F2A44; font-family: 'Nunito', system-ui, sans-serif; position: relative;">
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: rgba(211,63,47,0.35);"></div>
  <div style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 48px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; color: #1F2A44; text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        {{t.leave}}
      </a>
      <h1 class="hand" style="margin: 0; font-size: 44px; font-weight: 700; color: #1F3A93; line-height: 1;">{{turnLabel}}</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;">
        <span style="font-size: 15px; color: #5C5A55;">Kraken <span class="hand" style="font-size: 24px; color: #D33F2F;">vs</span> Nautilus · {{t.room}} <strong style="letter-spacing: 0.12em; color: #1F2A44;">7F3K9Q</strong></span>
        <div role="group" aria-label="Language" style="display: inline-flex; border: 2px solid #1F2A44; border-radius: 999px; overflow: hidden; font-size: 13px; font-weight: 800;">
          <button type="button" class="lng" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="background: {{enBg}}; color: {{enFg}};">EN</button>
          <button type="button" class="lng" onClick="{{setPl}}" aria-pressed="{{plPressed}}" style="background: {{plBg}}; color: {{plFg}};">PL</button>
        </div>
      </div>
    </header>

    <div role="status" class="hand" style="align-self: center; font-size: 26px; color: #B4321F; background: #FFFFFF; padding: 4px 18px; transform: rotate(-1deg); box-shadow: 0 6px 16px -10px rgba(60,40,10,0.4);">{{statusMsg}}</div>

    <main style="display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start;">
      <section class="note" style="flex: 0 1 440px; padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; box-sizing: border-box; transform: rotate(-0.5deg);">
        <h2 class="hand" style="margin: 0; align-self: flex-start; font-size: 32px; font-weight: 700;">{{t.myFleet}}</h2>
        <div class="wrap">
          <span></span>
          <div class="axis" style="grid-template-columns: repeat(10, minmax(0, 1fr));"><sc-for list="{{cols}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="axis" style="grid-template-rows: repeat(10, minmax(0, 1fr));"><sc-for list="{{rows}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="board" aria-label="My fleet board">
            <sc-for list="{{mine}}" as="c" hint-placeholder-count="100"><div class="{{c.cls}}" aria-label="{{c.label}}"></div></sc-for>
          </div>
        </div>
      </section>

      <section class="note" style="position: relative; flex: 0 1 440px; padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; box-sizing: border-box; transform: rotate(0.6deg);">
        <span class="tape" aria-hidden="true"></span>
        <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
          <h2 class="hand" style="margin: 0; font-size: 32px; font-weight: 700;">{{t.theirSea}}</h2>
          <button type="button" onClick="{{toggleMark}}" aria-pressed="{{markPressed}}" class="sketch" style="min-height: 40px; padding: 0 16px; background: {{markBg}}; color: #1F2A44; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">{{markLabel}}</button>
        </div>
        <div class="wrap">
          <span></span>
          <div class="axis" style="grid-template-columns: repeat(10, minmax(0, 1fr));"><sc-for list="{{cols}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="axis" style="grid-template-rows: repeat(10, minmax(0, 1fr));"><sc-for list="{{rows}}" as="l" hint-placeholder-count="10"><span>{{l}}</span></sc-for></div>
          <div class="board" aria-label="Enemy board">
            <sc-for list="{{radar}}" as="c" hint-placeholder-count="100"><button type="button" class="{{c.cls}}" aria-label="{{c.label}}" onClick="{{c.fire}}"></button></sc-for>
          </div>
        </div>
      </section>

      <aside class="note" style="flex: 1 1 220px; max-width: 280px; padding: 22px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-1deg);">
        <h2 class="hand" style="margin: 0 0 4px; font-size: 30px; font-weight: 700;">{{t.afloat}}</h2>
        <sc-for list="{{fleet}}" as="s" hint-placeholder-count="10">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px;">
            <span style="color: {{s.textColor}}; text-decoration: {{s.deco}}; text-decoration-color: #D33F2F; text-decoration-thickness: 2px;">{{s.name}}</span>
            <span style="display: flex; gap: 2px;"><sc-for list="{{s.pips}}" as="p" hint-placeholder-count="3"><span style="width: 14px; height: 14px; border: 1.5px solid #1F3A93; background: {{p.bg}}; box-sizing: border-box;"></span></sc-for></span>
          </div>
        </sc-for>
        <p class="hand" style="margin: 10px 0 0; font-size: 22px; color: #5C5A55; line-height: 1.2;">{{t.tip}}</p>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  langVals(T) {
    var self = this;
    var lang = (this.state && this.state.lang) || 'en';
    var C = {
      en: { navLobby: 'Lobby', navHistory: 'Match history', navRules: 'How to play', privacy: 'Privacy', terms: 'Terms', footer: 'Battleship · open source (MIT) · Icons: Lucide (ISC), Simple Icons (CC0) · Fonts: Caveat, Nunito (OFL)' },
      pl: { navLobby: 'Lobby', navHistory: 'Historia meczów', navRules: 'Jak grać', privacy: 'Prywatność', terms: 'Regulamin', footer: 'Battleship · open source (MIT) · Ikony: Lucide (ISC), Simple Icons (CC0) · Fonty: Caveat, Nunito (OFL)' }
    };
    var en = lang === 'en';
    return {
      lang: lang,
      t: Object.assign({}, C[lang], T[lang]),
      setEn: function () { self.setState({ lang: 'en' }); },
      setPl: function () { self.setState({ lang: 'pl' }); },
      enPressed: en ? 'true' : 'false', plPressed: en ? 'false' : 'true',
      enBg: en ? '#1F2A44' : 'transparent', enFg: en ? '#FFFFFF' : '#1F2A44',
      plBg: en ? 'transparent' : '#1F2A44', plFg: en ? '#1F2A44' : '#FFFFFF'
    };
  }
  renderVals() {
    var L = this.langVals({ en: {"room": "room", "leave": "Leave game", "myFleet": "My fleet", "theirSea": "Their sea", "afloat": "Still afloat", "tip": "tip: turn on “mark” to pencil in where you think they are", "hitMsg": " — hit! nice one", "missMsg": " — splash, missed", "mast": "-mast ship", "turn": "Your turn — take a shot!", "ouch": "ouch — they sank your boat at H9", "markOn": "Marking: on", "markOff": "Mark mode"}, pl: {"room": "pokój", "leave": "Opuść grę", "myFleet": "Moja flota", "theirSea": "Morze przeciwnika", "afloat": "Wciąż na wodzie", "tip": "podpowiedź: włącz „zaznaczanie”, żeby ołówkiem zaznaczyć, gdzie mogą być", "hitMsg": " — trafiony! brawo", "missMsg": " — plusk, pudło", "mast": "-masztowiec", "turn": "Twoja tura — strzelaj!", "ouch": "auć — zatopili Ci łódkę na H9", "markOn": "Zaznaczanie: wł.", "markOff": "Tryb zaznaczania"} });
    var t = L.t;
    var self = this;
    var N = 10;
    var COLS = 'ABCDEFGHIJ';
    var key = function (p) { return p[1] * N + p[0]; };
    var toSet = function (list) { var o = {}; list.forEach(function (p) { o[key(p)] = true; }); return o; };
    var myShips = toSet([[1,1],[2,1],[3,1],[4,1],[7,0],[7,1],[7,2],[0,4],[1,4],[2,4],[5,4],[5,5],[8,5],[9,5],[2,7],[3,7],[7,8],[0,9],[9,9],[5,8]]);
    var myHits = toSet([[2,1],[3,1],[7,8]]);
    var myMiss = toSet([[0,0],[5,2],[9,3],[4,6],[6,9],[1,7]]);
    var enemy = toSet([[0,0],[0,1],[0,2],[0,3],[3,3],[3,4],[3,5],[9,4],[9,5],[9,6],[8,0],[9,0],[6,7],[6,8],[1,8],[2,8],[5,1],[7,4],[4,9],[8,9]]);
    var initial = {};
    [[3,3],[3,4],[3,5]].forEach(function (p) { initial[key(p)] = 'sunk'; });
    initial[key([6,7])] = 'hit';
    [[1,1],[5,0],[8,2],[0,6],[6,5],[9,8],[2,9],[7,7]].forEach(function (p) { initial[key(p)] = 'miss'; });
    [[6,6],[6,8]].forEach(function (p) { initial[key(p)] = 'mark'; });

    var st = this.state || {};
    var shots = st.shots || initial;
    var markMode = !!st.markMode;
    var label = function (i) { return COLS[i % N] + (Math.floor(i / N) + 1); };
    var mine = [], radar = [];
    for (let i = 0; i < N * N; i++) {
      var cls = 'cell';
      if (myShips[i]) cls += ' ship';
      if (myHits[i]) cls += ' hit';
      if (myMiss[i]) cls += ' miss';
      mine.push({ cls: cls, label: label(i) });
      var v = shots[i];
      radar.push({
        cls: 'cell' + (v ? ' ' + v : ''),
        label: label(i) + (v ? ' ' + v : ''),
        fire: function () {
          var cur = Object.assign({}, (self.state && self.state.shots) || initial);
          var now = cur[i];
          if (self.state && self.state.markMode) {
            if (!now) cur[i] = 'mark'; else if (now === 'mark') delete cur[i]; else return;
            self.setState({ shots: cur });
            return;
          }
          if (now && now !== 'mark') return;
          var res = enemy[i] ? 'hit' : 'miss';
          cur[i] = res;
          self.setState({ shots: cur, last: label(i) + (res === 'hit' ? t.hitMsg : t.missMsg) });
        }
      });
    }
    var fleetDef = [[4,false],[3,true],[3,false],[2,false],[2,false],[2,false],[1,false],[1,false],[1,false],[1,false]];
    var fleet = fleetDef.map(function (d) {
      var pips = [];
      for (var k = 0; k < d[0]; k++) pips.push({ bg: d[1] ? '#F4C9C2' : '#DCE6FA' });
      return { name: d[0] + t.mast, pips: pips, textColor: d[1] ? '#8A8478' : '#1F2A44', deco: d[1] ? 'line-through' : 'none' };
    });
    var cols = COLS.split('');
    var rows = []; for (var r = 1; r <= N; r++) rows.push(r);
    return Object.assign({
      mine: mine, radar: radar, fleet: fleet, cols: cols, rows: rows,
      turnLabel: t.turn,
      statusMsg: st.last ? st.last : t.ouch,
      toggleMark: function () { self.setState({ markMode: !markMode }); },
      markPressed: markMode ? 'true' : 'false',
      markLabel: markMode ? t.markOn : t.markOff,
      markBg: markMode ? '#FFE873' : '#FFFFFF'
    }, L);
  }
}
</script>
</body>
</html>

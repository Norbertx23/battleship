name: Release (GHCR)

# Buduje obrazy na runnerach GitHuba i publikuje je do GHCR.
# Serwer sam pobiera obrazy (model pull) - nie ma tu joba deployującego.
# Stary ci-cd.yml celowo zostaje nietknięty do czasu przełączenia.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Nazwy obrazów w GHCR muszą być pisane małymi literami.
  IMAGE_API: ghcr.io/norbertx23/battleship-api
  IMAGE_WEB: ghcr.io/norbertx23/battleship-web

jobs:
  test-backend:
    name: Testy backendu (bramka)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: battleship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d battleship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/battleship_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalacja zależności
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testy (pytest)
        run: pytest -v

  build-frontend:
    name: Build frontendu (bramka)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalacja zależności
        run: npm ci
      - name: Build produkcyjny
        run: npm run build

  publish:
    name: Publikacja obrazów do GHCR
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Logowanie do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build i push WEB
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Podsumowanie
        run: |
          echo "### Opublikowane obrazy" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_API }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_WEB }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

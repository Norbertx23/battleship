name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Testy backendu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: battleship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d battleship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/battleship_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalacja zależności
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testy (pytest)
        run: pytest -v

  build-frontend:
    name: Build frontendu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalacja zależności
        run: npm ci
      - name: Build produkcyjny
        run: npm run build

  build-images:
    name: Budowanie obrazów Dockera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build obrazu backendu
        run: docker build -t battleship-backend:ci ./backend
      - name: Build obrazu frontendu
        run: docker build -t battleship-frontend:ci ./frontend

  deploy:
    name: Deploy na homelab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, build-frontend, build-images]
    runs-on: self-hosted
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - uses: actions/checkout@v4
      - name: Przebudowanie i restart kontenerów
        run: docker compose up -d --build
      - name: Weryfikacja healthchecka po deployu
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/healthz > /dev/null; then
              echo "Backend zdrowy - deploy zakończony"
              exit 0
            fi
            sleep 2
          done
          echo "Backend nie odpowiada po deployu"
          docker compose logs --tail=50 backend
          exit 1
